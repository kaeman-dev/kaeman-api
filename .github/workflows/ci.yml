name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        id: lint
        continue-on-error: true
        with:
          version: latest
          args: --fix

      - name: Save lint fixes
        id: patch
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet -- '*.go'; then
            git diff --binary -- '*.go' > "$RUNNER_TEMP/lint-fixes.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git restore --worktree -- '*.go'
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.patch.outputs.changed == 'true' }}
        with:
          name: lint-fixes
          path: ${{ runner.temp }}/lint-fixes.patch
          retention-days: 7
          if-no-files-found: error

      - name: Check lint result
        if: ${{ !cancelled() && (steps.lint.outcome != 'success' || steps.patch.outputs.changed == 'true') }}
        run: |
          echo "::error::Lint failed or requires fixes. Download the lint-fixes artifact if available."
          exit 1

      - run: make test

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          cache: false
          repo-checkout: false
